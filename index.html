<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cold Store Tracker</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --text:#1a1d23; --muted:#6b7280;
    --border:#e2e4e8; --accent:#2563eb; --accent-text:#ffffff;
    --danger:#dc2626; --sealed:#16a34a; --notsealed:#9ca3af;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#15171b; --card:#1f2228; --text:#e8e9eb; --muted:#9aa0a8;
      --border:#2d3138; --accent:#3b82f6; --accent-text:#ffffff;
      --danger:#f87171; --sealed:#4ade80; --notsealed:#6b7280; }
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
  header{position:sticky; top:0; z-index:5; background:var(--bg);
    padding:14px 16px 8px; padding-top:calc(14px + env(safe-area-inset-top,0px));
    border-bottom:1px solid var(--border);}
  h1{font-size:1.25rem; margin:0 0 4px;}
  .sub{color:var(--muted); font-size:0.85rem;}
  main{padding:12px 12px 40px; max-width:640px; margin:0 auto;}
  .block-head{display:flex; justify-content:space-between; align-items:baseline;
    margin:18px 4px 8px;}
  .block-head h2{font-size:1.05rem; margin:0;}
  .block-head .count{color:var(--muted); font-size:0.85rem;}
  .room{background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:12px; margin-bottom:10px;}
  .room-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .room-title{font-weight:600;}
  .room-total{color:var(--muted); font-size:0.8rem;}
  .toggle-col{display:flex; flex-direction:column; gap:6px; align-items:flex-end;}
  .seal-wrap{display:flex; align-items:center; gap:8px; font-size:0.85rem;}
  .seal-label{color:var(--muted); white-space:nowrap;}
  .seal-label.on{color:var(--sealed); font-weight:600;}
  .seal-label.suction.on{color:var(--accent); font-weight:600;}
  .switch{position:relative; width:46px; height:26px; flex:none;}
  .switch input{opacity:0; width:100%; height:100%; margin:0; position:absolute; z-index:2; cursor:pointer;}
  .track{position:absolute; inset:0; background:var(--notsealed); border-radius:999px; transition:.15s;}
  .switch input:checked + .track{background:var(--sealed);}
  .knob{position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%;
    background:#fff; transition:.15s;}
  .switch input:checked ~ .knob{left:23px;}
  .entries{margin-top:10px; display:flex; flex-direction:column; gap:6px;}
  .entry{display:flex; gap:6px; align-items:center;}
  input[type=text], input[type=number]{
    background:var(--bg); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:8px 10px; font-size:0.95rem; width:100%;}
  input[type=number]{width:72px; text-align:center;}
  .entry label{position:absolute; left:-9999px;}
  .rm-btn{background:none; border:none; color:var(--muted); font-size:1.1rem;
    width:30px; height:30px; flex:none; cursor:pointer; border-radius:6px;}
  .rm-btn:active{background:var(--border);}
  .add-btn{margin-top:8px; background:none; border:1px dashed var(--border);
    color:var(--accent); padding:8px; border-radius:8px; width:100%; font-size:0.9rem; cursor:pointer;}
  .toolbar{display:flex; gap:8px; margin-top:6px;}
  .toolbar button{flex:1; padding:10px; border-radius:10px; border:1px solid var(--border);
    background:var(--card); color:var(--text); font-size:0.9rem; cursor:pointer;}
  .toolbar button.primary{background:var(--accent); color:var(--accent-text); border:none;}
  .grand-total{font-weight:700;}
  dialog{border:none; border-radius:12px; padding:0; max-width:320px; width:88%;
    background:var(--card); color:var(--text);}
  dialog::backdrop{background:rgba(0,0,0,0.45);}
  .dlg-body{padding:18px;}
  .dlg-body h3{margin:0 0 8px;}
  .dlg-actions{display:flex; gap:8px; margin-top:16px;}
  .dlg-actions button{flex:1; padding:10px; border-radius:8px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-size:0.9rem;}
  .dlg-actions button.confirm{background:var(--accent); color:var(--accent-text); border:none;}
  .dlg-actions button.confirm.danger{background:var(--danger);}
  .dlg-actions button.confirm.danger:disabled{opacity:0.45;}
  .danger-title{color:var(--danger);}
  .danger-text{font-size:0.85rem; color:var(--muted);}
  .ack-row{display:flex; align-items:flex-start; gap:8px; margin-top:12px; font-size:0.85rem; cursor:pointer;}
  .ack-row input{margin-top:2px; flex:none;}
  .toast{position:fixed; bottom:calc(16px + env(safe-area-inset-bottom,0px)); left:50%;
    transform:translateX(-50%); background:var(--text); color:var(--bg);
    padding:10px 16px; border-radius:999px; font-size:0.85rem; opacity:0; pointer-events:none;
    transition:opacity .2s; z-index:20;}
  .toast.show{opacity:1;}
  #importFile{display:none;}
</style>
</head>
<body>
<header>
  <h1>Cold Store Tracker</h1>
  <div class="sub" id="grandTotal">Loading…</div>
</header>
<main id="main"></main>

<dialog id="importDlg">
  <div class="dlg-body">
    <h3 class="danger-title">Overwrite all data?</h3>
    <p>You're about to import <strong id="importFileName"></strong>.</p>
    <p class="danger-text">This will <strong>permanently replace every room's data</strong> currently
      on this device — pallet counts, orchard numbers, sealed status, suction status — with
      whatever is in that file. This <strong>cannot be undone</strong>.</p>
    <p class="danger-text">Current data: <strong id="importCurrentSummary"></strong></p>
    <label class="ack-row">
      <input type="checkbox" id="importAck">
      <span>I understand this will erase current data on this device</span>
    </label>
    <div class="dlg-actions">
      <button id="importCancel">Cancel</button>
      <button id="importConfirm" class="confirm danger" disabled>Overwrite data</button>
    </div>
  </div>
</dialog>

<dialog id="sealDlg">
  <div class="dlg-body">
    <h3 id="sealDlgTitle">Room</h3>
    <p id="sealDlgText"></p>
    <div class="dlg-actions">
      <button id="sealCancel">Cancel</button>
      <button id="sealConfirm" class="confirm">Yes</button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json">

<script>
// ---- Config: edit room ranges here if your layout differs ----
const BLOCKS = [
  { name: "Block 1 – Bulk (carryover)", rooms: [1,2] },
  { name: "Block 2", rooms: [3,4,5,6,7] },
  { name: "Block 3", rooms: [8,9,10,11,12] }, // you said 9-12; room 8 added so all 17 rooms are covered — edit if wrong
  { name: "Block 4", rooms: [13,14,15,16,17] },
];
const STORAGE_KEY = "coldstore_data_v1";

// ---- State ----
function defaultRoom(id){ return { id, sealed:false, suction:false, entries:[{orchard:"", pallets:""}] }; }
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      const byId = {};
      (parsed.rooms||[]).forEach(r => byId[r.id] = r);
      const rooms = {};
      BLOCKS.forEach(b => b.rooms.forEach(id => {
        const r = byId[id] || defaultRoom(id);
        if(typeof r.suction !== "boolean") r.suction = false;
        rooms[id] = r;
      }));
      return { rooms };
    }
  }catch(e){ console.error("load failed", e); }
  const rooms = {};
  BLOCKS.forEach(b => b.rooms.forEach(id => { rooms[id] = defaultRoom(id); }));
  return { rooms };
}
let state = loadState();

function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ rooms: Object.values(state.rooms), savedAt: Date.now() }));
  }catch(e){ console.error("save failed", e); showToast("Save failed — storage may be full"); }
}

function roomTotal(r){ return r.entries.reduce((s,e)=> s + (parseInt(e.pallets,10)||0), 0); }
function grandTotal(){ return Object.values(state.rooms).reduce((s,r)=> s + roomTotal(r), 0); }

// ---- Render ----
function render(){
  const main = document.getElementById("main");
  main.innerHTML = "";
  BLOCKS.forEach(block => {
    const head = document.createElement("div");
    head.className = "block-head";
    const blockTotal = block.rooms.reduce((s,id)=> s + roomTotal(state.rooms[id]), 0);
    head.innerHTML = `<h2>${block.name}</h2><span class="count">${blockTotal} pallets</span>`;
    main.appendChild(head);
    block.rooms.forEach(id => main.appendChild(renderRoom(state.rooms[id])));
  });

  const tb = document.createElement("div");
  tb.className = "toolbar";
  tb.innerHTML = `
    <button id="exportBtn">Export backup</button>
    <button id="importBtn">Import backup</button>`;
  main.appendChild(tb);
  document.getElementById("exportBtn").onclick = exportData;
  document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();

  document.getElementById("grandTotal").textContent = `${grandTotal()} pallets across 17 rooms`;
}

function renderRoom(room){
  const div = document.createElement("div");
  div.className = "room";

  const top = document.createElement("div");
  top.className = "room-top";
  top.innerHTML = `
    <div>
      <div class="room-title">Room ${room.id}</div>
      <div class="room-total">${roomTotal(room)} pallets</div>
    </div>
    <div class="toggle-col">
      <div class="seal-wrap">
        <span class="seal-label ${room.sealed?'on':''}">${room.sealed?'Sealed':'Not sealed'}</span>
        <label class="switch">
          <input type="checkbox" ${room.sealed?'checked':''} data-room="${room.id}" data-toggle="sealed" class="seal-toggle">
          <span class="track"></span><span class="knob"></span>
        </label>
      </div>
      <div class="seal-wrap">
        <span class="seal-label suction ${room.suction?'on':''}">${room.suction?'Suction':'No suction'}</span>
        <label class="switch">
          <input type="checkbox" ${room.suction?'checked':''} data-room="${room.id}" data-toggle="suction" class="seal-toggle">
          <span class="track"></span><span class="knob"></span>
        </label>
      </div>
    </div>`;
  div.appendChild(top);

  const entriesDiv = document.createElement("div");
  entriesDiv.className = "entries";
  room.entries.forEach((e, i) => {
    const row = document.createElement("div");
    row.className = "entry";
    row.innerHTML = `
      <input type="text" placeholder="Orchard no." value="${escapeHtml(e.orchard)}" data-room="${room.id}" data-idx="${i}" data-field="orchard">
      <input type="number" inputmode="numeric" min="0" placeholder="Pallets" value="${escapeHtml(e.pallets)}" data-room="${room.id}" data-idx="${i}" data-field="pallets">
      ${room.entries.length > 1 ? `<button class="rm-btn" data-room="${room.id}" data-idx="${i}">✕</button>` : `<span style="width:30px"></span>`}
    `;
    entriesDiv.appendChild(row);
  });
  div.appendChild(entriesDiv);

  const addBtn = document.createElement("button");
  addBtn.className = "add-btn";
  addBtn.textContent = "+ Add orchard";
  addBtn.dataset.room = room.id;
  addBtn.onclick = () => {
    room.entries.push({orchard:"", pallets:""});
    save(); render();
  };
  div.appendChild(addBtn);

  entriesDiv.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("input", onEntryInput);
  });
  entriesDiv.querySelectorAll(".rm-btn").forEach(btn => {
    btn.addEventListener("click", onRemoveEntry);
  });
  top.querySelectorAll(".seal-toggle").forEach(sw => sw.addEventListener("change", onSealToggle));

  return div;
}

function escapeHtml(s){ return String(s).replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

function onEntryInput(ev){
  const { room, idx, field } = ev.target.dataset;
  const r = state.rooms[room];
  let v = ev.target.value;
  if(field === "pallets"){ v = v.replace(/[^0-9]/g,""); }
  r.entries[idx][field] = v;
  save();
  // update totals without full re-render to keep focus
  const roomDiv = ev.target.closest(".room");
  roomDiv.querySelector(".room-total").textContent = `${roomTotal(r)} pallets`;
  document.getElementById("grandTotal").textContent = `${grandTotal()} pallets across 17 rooms`;
  updateBlockTotals();
}

function updateBlockTotals(){
  document.querySelectorAll(".block-head").forEach((head, i) => {
    const block = BLOCKS[i];
    const total = block.rooms.reduce((s,id)=> s + roomTotal(state.rooms[id]), 0);
    head.querySelector(".count").textContent = `${total} pallets`;
  });
}

function onRemoveEntry(ev){
  const { room, idx } = ev.target.dataset;
  state.rooms[room].entries.splice(idx, 1);
  save(); render();
}

let pendingToggle = null; // { roomId, field }
const FIELD_LABEL = { sealed: ["SEALED","NOT sealed"], suction: ["SUCTION ON","suction OFF"] };
function onSealToggle(ev){
  const roomId = ev.target.dataset.room;
  const field = ev.target.dataset.toggle;
  ev.target.checked = !ev.target.checked; // revert until confirmed
  pendingToggle = { roomId, field };
  const willBe = !state.rooms[roomId][field];
  const [onLabel, offLabel] = FIELD_LABEL[field];
  document.getElementById("sealDlgTitle").textContent = `Room ${roomId}`;
  document.getElementById("sealDlgText").textContent =
    `Mark this room as ${willBe ? onLabel : offLabel}?`;
  document.getElementById("sealDlg").showModal();
}
document.getElementById("sealCancel").onclick = () => document.getElementById("sealDlg").close();
document.getElementById("sealConfirm").onclick = () => {
  const { roomId, field } = pendingToggle;
  const r = state.rooms[roomId];
  r[field] = !r[field];
  save();
  document.getElementById("sealDlg").close();
  render();
};

// ---- Backup export / import (survives browser cache clears) ----
function exportData(){
  const data = JSON.stringify({ rooms: Object.values(state.rooms), exportedAt: new Date().toISOString() }, null, 2);
  const blob = new Blob([data], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0,16).replace(/[:T]/g,"-");
  a.href = url; a.download = `coldstore-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast("Backup saved to Downloads");
}
let pendingImport = null;
document.getElementById("importFile").addEventListener("change", ev => {
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!Array.isArray(parsed.rooms)) throw new Error("no rooms array");
      pendingImport = { parsed, fileName: file.name };
      document.getElementById("importFileName").textContent = file.name;
      const currentPallets = grandTotal();
      const currentRoomsWithData = Object.values(state.rooms).filter(r =>
        r.entries.some(e => e.orchard || e.pallets)).length;
      document.getElementById("importCurrentSummary").textContent =
        `${currentPallets} pallets logged across ${currentRoomsWithData} room(s)`;
      const ack = document.getElementById("importAck");
      const confirmBtn = document.getElementById("importConfirm");
      ack.checked = false;
      confirmBtn.disabled = true;
      document.getElementById("importDlg").showModal();
    }catch(e){
      showToast("Import failed — invalid file");
    }
  };
  reader.readAsText(file);
  ev.target.value = "";
});
document.getElementById("importAck").addEventListener("change", ev => {
  document.getElementById("importConfirm").disabled = !ev.target.checked;
});
document.getElementById("importCancel").onclick = () => {
  pendingImport = null;
  document.getElementById("importDlg").close();
};
document.getElementById("importConfirm").onclick = () => {
  if(!pendingImport) return;
  const byId = {};
  pendingImport.parsed.rooms.forEach(r => byId[r.id] = r);
  BLOCKS.forEach(b => b.rooms.forEach(id => {
    const r = byId[id] || defaultRoom(id);
    if(typeof r.suction !== "boolean") r.suction = false;
    state.rooms[id] = r;
  }));
  save(); render();
  document.getElementById("importDlg").close();
  showToast("Backup imported");
  pendingImport = null;
};

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=> t.classList.remove("show"), 2200);
}

render();
</script>
</body>
</html>
